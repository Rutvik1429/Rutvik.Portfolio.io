<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0b0f17"/>
  <rect x="0" y="0" width="800" height="45" fill="#131b2e"/>
  <circle cx="20" cy="22.5" r="6" fill="#ef4444"/>
  <circle cx="40" cy="22.5" r="6" fill="#f59e0b"/>
  <circle cx="60" cy="22.5" r="6" fill="#10b981"/>
  <text x="80" y="27" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="600">Customer Churn Analysis | Python EDA &amp; Risk Prediction Report</text>
  
  <g transform="translate(20, 65)">
    <rect width="360" height="360" rx="8" fill="#131b2e" stroke="#23314d" stroke-width="1"/>
    <text x="20" y="30" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600">Churn Rate by Contract Type</text>
    <!-- Donut chart placeholder -->
    <circle cx="180" cy="180" r="90" fill="none" stroke="#23314d" stroke-width="30"/>
    <circle cx="180" cy="180" r="90" fill="none" stroke="#f87171" stroke-width="30" stroke-dasharray="240 500" stroke-dashoffset="0"/>
    <circle cx="180" cy="180" r="90" fill="none" stroke="#3b82f6" stroke-width="30" stroke-dasharray="180 500" stroke-dashoffset="-240"/>
    <circle cx="180" cy="180" r="90" fill="none" stroke="#10b981" stroke-width="30" stroke-dasharray="100 500" stroke-dashoffset="-420"/>
    <text x="180" y="175" fill="#f1f5f9" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">26.5%</text>
    <text x="180" y="195" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Overall Churn</text>
    
    <text x="30" y="320" fill="#f87171" font-family="sans-serif" font-size="11">■ Month-to-Month (42% Churn)</text>
    <text x="180" y="320" fill="#3b82f6" font-family="sans-serif" font-size="11">■ 1-Year (11% Churn)</text>
    <text x="280" y="320" fill="#10b981" font-family="sans-serif" font-size="11">■ 2-Year (3% Churn)</text>
  </g>

  <g transform="translate(400, 65)">
    <rect width="380" height="360" rx="8" fill="#131b2e" stroke="#23314d" stroke-width="1"/>
    <text x="20" y="30" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600">Churn Risk vs Monthly Charges ($)</text>
    <!-- Bar charts for tenure & charges -->
    <rect x="40" y="70" width="220" height="28" rx="4" fill="#f87171"/>
    <text x="270" y="89" fill="#94a3b8" font-family="sans-serif" font-size="12">$80 - $110 / Mo</text>

    <rect x="40" y="120" width="160" height="28" rx="4" fill="#fbbf24"/>
    <text x="210" y="139" fill="#94a3b8" font-family="sans-serif" font-size="12">$50 - $80 / Mo</text>

    <rect x="40" y="170" width="90" height="28" rx="4" fill="#38bdf8"/>
    <text x="140" y="189" fill="#94a3b8" font-family="sans-serif" font-size="12">$20 - $50 / Mo</text>

    <text x="20" y="240" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600">Retention Recommendation Strategy</text>
    <rect x="20" y="255" width="340" height="85" rx="6" fill="#0b0f17" stroke="#23314d"/>
    <text x="35" y="280" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">✓ Offer 1-Year Discount Incentives</text>
    <text x="35" y="300" fill="#94a3b8" font-family="sans-serif" font-size="11">Target Month-to-Month customers reaching 4th month tenure.</text>
    <text x="35" y="320" fill="#94a3b8" font-family="sans-serif" font-size="11">Estimated Retention Impact: +14% Customer Lifespan.</text>
  </g>
</svg>
