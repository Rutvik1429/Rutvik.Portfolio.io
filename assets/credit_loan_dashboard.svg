<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0f172a"/>
  <!-- Header Bar -->
  <rect x="0" y="0" width="800" height="45" fill="#1e293b"/>
  <circle cx="20" cy="225" r="6" fill="#ef4444"/>
  <circle cx="40" cy="225" r="6" fill="#f59e0b"/>
  <circle cx="60" cy="225" r="6" fill="#10b981"/>
  <text x="80" y="27" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="600">Credit Loan Disbursement &amp; Recovery Analysis | Power BI Executive Dashboard</text>
  
  <!-- KPI Cards -->
  <g transform="translate(20, 65)">
    <!-- Card 1 -->
    <rect width="175" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="25" fill="#94a3b8" font-family="sans-serif" font-size="11">TOTAL DISBURSED</text>
    <text x="15" y="52" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold">$14.8M</text>
    <text x="15" y="70" fill="#10b981" font-family="sans-serif" font-size="10">▲ +12.4% MoM</text>
    
    <!-- Card 2 -->
    <rect x="190" width="175" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="205" y="25" fill="#94a3b8" font-family="sans-serif" font-size="11">TOTAL RECOVERED</text>
    <text x="205" y="52" fill="#34d399" font-family="sans-serif" font-size="20" font-weight="bold">$11.2M</text>
    <text x="205" y="70" fill="#10b981" font-family="sans-serif" font-size="10">75.6% Recovery Rate</text>

    <!-- Card 3 -->
    <rect x="380" width="175" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="395" y="25" fill="#94a3b8" font-family="sans-serif" font-size="11">OVERDUE AMOUNT (NPA)</text>
    <text x="395" y="52" fill="#f87171" font-family="sans-serif" font-size="20" font-weight="bold">$1.45M</text>
    <text x="395" y="70" fill="#f87171" font-family="sans-serif" font-size="10">9.8% Portfolio Risk</text>

    <!-- Card 4 -->
    <rect x="570" width="190" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="585" y="25" fill="#94a3b8" font-family="sans-serif" font-size="11">ACTIVE LOAN ACCOUNTS</text>
    <text x="585" y="52" fill="#818cf8" font-family="sans-serif" font-size="20" font-weight="bold">4,280</text>
    <text x="585" y="70" fill="#94a3b8" font-family="sans-serif" font-size="10">Avg Score: 710</text>
  </g>

  <!-- Charts Row 1 -->
  <g transform="translate(20, 160)">
    <!-- Line Chart Container -->
    <rect width="460" height="265" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">Disbursement vs Recovery Trend (2024 - 2025)</text>
    <!-- Axis lines -->
    <line x1="40" y1="220" x2="440" y2="220" stroke="#475569" stroke-width="1"/>
    <line x1="40" y1="60" x2="40" y2="220" stroke="#475569" stroke-width="1"/>
    <!-- Disbursement Line -->
    <path d="M40 180 Q 100 120, 160 140 T 280 80 T 440 65" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <!-- Recovery Line -->
    <path d="M40 200 Q 100 160, 160 170 T 280 120 T 440 100" fill="none" stroke="#34d399" stroke-width="3"/>
    
    <!-- Legend -->
    <rect x="250" y="15" width="10" height="10" fill="#38bdf8"/>
    <text x="265" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11">Disbursed</text>
    <rect x="340" y="15" width="10" height="10" fill="#34d399"/>
    <text x="355" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11">Recovered</text>

    <!-- Bar Chart Container -->
    <rect x="475" width="285" height="265" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="490" y="30" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">NPA Overdue Breakdown</text>
    
    <rect x="490" y="60" width="140" height="24" fill="#38bdf8" rx="4"/>
    <text x="640" y="77" fill="#94a3b8" font-family="sans-serif" font-size="11">30-60 Days</text>
    
    <rect x="490" y="100" width="190" height="24" fill="#fbbf24" rx="4"/>
    <text x="690" y="117" fill="#94a3b8" font-family="sans-serif" font-size="11">60-90 Days</text>

    <rect x="490" y="140" width="110" height="24" fill="#f87171" rx="4"/>
    <text x="610" y="157" fill="#94a3b8" font-family="sans-serif" font-size="11">90+ Days (Default)</text>

    <rect x="490" y="180" width="80" height="24" fill="#a855f7" rx="4"/>
    <text x="580" y="197" fill="#94a3b8" font-family="sans-serif" font-size="11">Written-off</text>
  </g>
</svg>
