<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0b0f17"/>
  <rect x="0" y="0" width="800" height="45" fill="#131b2e"/>
  <circle cx="20" cy="22.5" r="6" fill="#ef4444"/>
  <circle cx="40" cy="22.5" r="6" fill="#f59e0b"/>
  <circle cx="60" cy="22.5" r="6" fill="#10b981"/>
  <text x="80" y="27" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="600">Vendor Performance Analytics | Power BI, SQL &amp; Python Report</text>
  
  <g transform="translate(20, 65)">
    <rect width="240" height="360" rx="8" fill="#131b2e" stroke="#23314d" stroke-width="1"/>
    <text x="15" y="30" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600">Top Vendor Scorecards</text>
    <line x1="15" y1="45" x2="225" y2="45" stroke="#23314d"/>
    
    <text x="15" y="75" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">1. Apex Logistics Ltd.</text>
    <text x="15" y="93" fill="#94a3b8" font-family="sans-serif" font-size="11">OTD Rate: 98.4% | Margin: 24%</text>

    <text x="15" y="130" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">2. Global Supply Co.</text>
    <text x="15" y="148" fill="#94a3b8" font-family="sans-serif" font-size="11">OTD Rate: 94.1% | Margin: 19%</text>

    <text x="15" y="185" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">3. Prime Manufacturing</text>
    <text x="15" y="203" fill="#94a3b8" font-family="sans-serif" font-size="11">OTD Rate: 91.8% | Margin: 21%</text>

    <text x="15" y="240" fill="#f87171" font-family="sans-serif" font-size="13" font-weight="bold">4. Zenith Enterprise (Underperforming)</text>
    <text x="15" y="258" fill="#94a3b8" font-family="sans-serif" font-size="11">OTD Rate: 74.2% | Margin: 11%</text>
  </g>

  <g transform="translate(280, 65)">
    <rect width="495" height="170" rx="8" fill="#131b2e" stroke="#23314d" stroke-width="1"/>
    <text x="20" y="30" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600">Vendor Sales Contribution vs Profitability Margin</text>
    <!-- Scatter plot points -->
    <circle cx="80" cy="120" r="14" fill="#06b6d4" opacity="0.8"/>
    <circle cx="160" cy="80" r="22" fill="#3b82f6" opacity="0.8"/>
    <circle cx="280" cy="110" r="18" fill="#10b981" opacity="0.8"/>
    <circle cx="380" cy="60" r="26" fill="#6366f1" opacity="0.8"/>
    <circle cx="440" cy="130" r="12" fill="#f43f5e" opacity="0.8"/>
    
    <rect y="185" width="495" height="175" rx="8" fill="#131b2e" stroke="#23314d" stroke-width="1"/>
    <text x="20" y="215" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600">Quarterly Delivery On-Time Rate (%)</text>
    <path d="M 30 310 Q 120 260, 210 275 T 390 240 T 470 230" fill="none" stroke="#06b6d4" stroke-width="3"/>
  </g>
