<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0b0f17"/>
  <rect x="0" y="0" width="800" height="45" fill="#131b2e"/>
  <circle cx="20" cy="22.5" r="6" fill="#ef4444"/>
  <circle cx="40" cy="22.5" r="6" fill="#f59e0b"/>
  <circle cx="60" cy="22.5" r="6" fill="#10b981"/>
  <text x="80" y="27" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="600">NYC Yellow Taxi Trip Report | Python Hypothesis Testing &amp; Tableau Report</text>
  
  <g transform="translate(20, 65)">
    <rect width="470" height="360" rx="8" fill="#131b2e" stroke="#23314d" stroke-width="1"/>
    <text x="20" y="30" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600">Trip Density &amp; Fare Distribution Spatial Heatmap</text>
    <!-- Map grid simulation -->
    <path d="M 40 100 L 430 100 M 40 160 L 430 160 M 40 220 L 430 220 M 40 280 L 430 280" stroke="#23314d" stroke-width="1"/>
    <path d="M 100 60 L 100 320 M 200 60 L 200 320 M 300 60 L 300 320 M 400 60 L 400 320" stroke="#23314d" stroke-width="1"/>
    
    <circle cx="200" cy="160" r="45" fill="#eab308" opacity="0.6"/>
    <circle cx="200" cy="160" r="20" fill="#ef4444" opacity="0.8"/>
    <text x="200" y="165" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">JFK Airport</text>

    <circle cx="330" cy="220" r="55" fill="#eab308" opacity="0.5"/>
    <circle cx="330" cy="220" r="28" fill="#ef4444" opacity="0.8"/>
    <text x="330" y="225" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Manhattan</text>
  </g>

  <g transform="translate(510, 65)">
    <rect width="270" height="360" rx="8" fill="#131b2e" stroke="#23314d" stroke-width="1"/>
    <text x="20" y="30" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600">Hypothesis Testing (t-Test)</text>
    <rect x="20" y="55" width="230" height="130" rx="6" fill="#0b0f17" stroke="#23314d"/>
    <text x="30" y="80" fill="#eab308" font-family="sans-serif" font-size="12" font-weight="bold">Null Hypothesis (H₀):</text>
    <text x="30" y="98" fill="#94a3b8" font-family="sans-serif" font-size="10">No fare/tip difference between card &amp; cash.</text>
    <text x="30" y="128" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">Result: H₀ Rejected (p &lt; 0.05)</text>
    <text x="30" y="146" fill="#94a3b8" font-family="sans-serif" font-size="10">Cardholders tip 16.2% more on average.</text>

    <text x="20" y="215" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600">Peak Rush Hour Fare Trends</text>
    <path d="M 30 310 Q 80 280, 130 240 T 230 300" fill="none" stroke="#eab308" stroke-width="3"/>
  </g>
</svg>
