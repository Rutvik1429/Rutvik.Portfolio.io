<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0b0f17"/>
  <rect x="0" y="0" width="800" height="45" fill="#131b2e"/>
  <circle cx="20" cy="22.5" r="6" fill="#ef4444"/>
  <circle cx="40" cy="22.5" r="6" fill="#f59e0b"/>
  <circle cx="60" cy="22.5" r="6" fill="#10b981"/>
  <text x="80" y="27" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="600">Customer Performance Dashboard | Power BI Star Schema &amp; DAX Report</text>
  
  <g transform="translate(20, 65)">
    <rect width="760" height="360" rx="8" fill="#131b2e" stroke="#23314d" stroke-width="1"/>
    
    <!-- DAX Measure Cards -->
    <rect x="20" y="20" width="170" height="70" rx="6" fill="#0b0f17" stroke="#23314d"/>
    <text x="35" y="42" fill="#94a3b8" font-family="sans-serif" font-size="10">TOTAL REVENUE (DAX)</text>
    <text x="35" y="66" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="bold">$2,490,120</text>

    <rect x="205" y="20" width="170" height="70" rx="6" fill="#0b0f17" stroke="#23314d"/>
    <text x="220" y="42" fill="#94a3b8" font-family="sans-serif" font-size="10">TOTAL ORDERS</text>
    <text x="220" y="66" fill="#10b981" font-family="sans-serif" font-size="18" font-weight="bold">12,840</text>

    <rect x="390" y="20" width="170" height="70" rx="6" fill="#0b0f17" stroke="#23314d"/>
    <text x="405" y="42" fill="#94a3b8" font-family="sans-serif" font-size="10">AVG ORDER VALUE (AOV)</text>
    <text x="405" y="66" fill="#fbbf24" font-family="sans-serif" font-size="18" font-weight="bold">$193.93</text>

    <rect x="575" y="20" width="165" height="70" rx="6" fill="#0b0f17" stroke="#23314d"/>
    <text x="590" y="42" fill="#94a3b8" font-family="sans-serif" font-size="10">ACTIVE CUSTOMERS</text>
    <text x="590" y="66" fill="#a855f7" font-family="sans-serif" font-size="18" font-weight="bold">3,150</text>

    <!-- Star Schema Data Model Visual -->
    <text x="20" y="125" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600">Star Schema Relational Data Model Architecture</text>
    <rect x="280" y="150" width="200" height="90" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="380" y="185" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">FACT_SALES</text>
    <text x="380" y="205" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">SalesID, CustomerID, Date, Amount</text>

    <rect x="30" y="270" width="180" height="65" rx="6" fill="#0b0f17" stroke="#23314d"/>
    <text x="120" y="298" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">DIM_CUSTOMER</text>
    <line x1="120" y1="270" x2="290" y2="220" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4"/>

    <rect x="290" y="270" width="180" height="65" rx="6" fill="#0b0f17" stroke="#23314d"/>
    <text x="380" y="298" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">DIM_PRODUCT</text>
    <line x1="380" y1="270" x2="380" y2="240" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4"/>

    <rect x="550" y="270" width="180" height="65" rx="6" fill="#0b0f17" stroke="#23314d"/>
    <text x="640" y="298" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">DIM_CALENDAR</text>
    <line x1="640" y1="270" x2="470" y2="220" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4"/>
  </g>
</svg>
