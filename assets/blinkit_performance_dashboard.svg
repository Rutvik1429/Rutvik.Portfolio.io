<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0b0f17"/>
  <rect x="0" y="0" width="800" height="45" fill="#131b2e"/>
  <circle cx="20" cy="22.5" r="6" fill="#ef4444"/>
  <circle cx="40" cy="22.5" r="6" fill="#f59e0b"/>
  <circle cx="60" cy="22.5" r="6" fill="#10b981"/>
  <text x="80" y="27" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="600">Blinkit Business Performance &amp; Operational Analysis | Excel ETL Report</text>
  
  <g transform="translate(20, 65)">
    <rect width="230" height="360" rx="8" fill="#131b2e" stroke="#23314d" stroke-width="1"/>
    <text x="20" y="30" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600">Total Outlet Revenue</text>
    <text x="20" y="65" fill="#eab308" font-family="sans-serif" font-size="24" font-weight="bold">$1.20M</text>
    
    <line x1="20" y1="85" x2="210" y2="85" stroke="#23314d"/>
    <text x="20" y="110" fill="#94a3b8" font-family="sans-serif" font-size="11">Average Rating: 3.9 ★</text>
    <text x="20" y="130" fill="#94a3b8" font-family="sans-serif" font-size="11">Total Items Sold: 8,523</text>
    
    <text x="20" y="170" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="bold">Item Fat Content</text>
    <rect x="20" y="185" width="120" height="18" fill="#10b981" rx="3"/>
    <text x="150" y="199" fill="#94a3b8" font-family="sans-serif" font-size="10">Low Fat (65%)</text>
    <rect x="20" y="210" width="70" height="18" fill="#3b82f6" rx="3"/>
    <text x="100" y="224" fill="#94a3b8" font-family="sans-serif" font-size="10">Regular (35%)</text>
  </g>

  <g transform="translate(270, 65)">
    <rect width="510" height="360" rx="8" fill="#131b2e" stroke="#23314d" stroke-width="1"/>
    <text x="20" y="30" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600">Sales by Outlet Tier Location ($)</text>
    <rect x="30" y="60" width="380" height="35" rx="4" fill="#eab308"/>
    <text x="420" y="82" fill="#94a3b8" font-family="sans-serif" font-size="12">Tier 3 ($472K)</text>

    <rect x="30" y="115" width="310" height="35" rx="4" fill="#38bdf8"/>
    <text x="350" y="137" fill="#94a3b8" font-family="sans-serif" font-size="12">Tier 2 ($393K)</text>

    <rect x="30" y="170" width="260" height="35" rx="4" fill="#34d399"/>
    <text x="300" y="192" fill="#94a3b8" font-family="sans-serif" font-size="12">Tier 1 ($336K)</text>

    <text x="20" y="240" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600">Item Category Breakdown</text>
    <rect x="30" y="260" width="100" height="60" rx="4" fill="#0b0f17" stroke="#23314d"/>
    <text x="40" y="285" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">Fruits &amp; Veg</text>
    <text x="40" y="305" fill="#94a3b8" font-family="sans-serif" font-size="11">$178K Sales</text>

    <rect x="145" y="260" width="100" height="60" rx="4" fill="#0b0f17" stroke="#23314d"/>
    <text x="155" y="285" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">Snack Foods</text>
    <text x="155" y="305" fill="#94a3b8" font-family="sans-serif" font-size="11">$172K Sales</text>

    <rect x="260" y="260" width="100" height="60" rx="4" fill="#0b0f17" stroke="#23314d"/>
    <text x="270" y="285" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">Household</text>
    <text x="270" y="305" fill="#94a3b8" font-family="sans-serif" font-size="11">$140K Sales</text>
  </g>
